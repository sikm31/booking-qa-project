services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-qa-postgres
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d booking"]
      interval: 2s
      timeout: 3s
      retries: 15
